[project]
name = "apiclient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Davuljigari-Karishma", email = "karishma.davuljigari@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
]

[project.scripts]
apiclient = "apiclient:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
